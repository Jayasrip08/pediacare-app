<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="70%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </radialGradient>
    <linearGradient id="hoodieG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="bearG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="heartG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Circular Backdrop -->
  <circle cx="250" cy="240" r="190" fill="url(#bgG)" filter="url(#dropShadow)" />

  <!-- Child Body / Blue Hoodie -->
  <path d="M 170,330 C 140,360 120,430 110,480 L 390,480 C 380,430 360,360 330,330 Z" fill="url(#hoodieG)" />
  <path d="M 190,320 L 250,380 L 310,320" fill="none" stroke="#1D4ED8" stroke-width="8" stroke-linecap="round"/>

  <!-- Child Head -->
  <circle cx="250" cy="200" r="85" fill="#FDE68A" />
  <!-- Hair (cute brown tufts) -->
  <path d="M 165,190 C 160,110 220,100 250,105 C 280,100 340,110 335,190 C 320,140 280,130 250,135 C 220,130 180,140 165,190 Z" fill="#78350F" />
  <circle cx="250" cy="115" r="16" fill="#78350F"/>
  <!-- Eyes -->
  <ellipse cx="220" cy="195" rx="7" ry="10" fill="#1E293B" />
  <ellipse cx="280" cy="195" rx="7" ry="10" fill="#1E293B" />
  <circle cx="222" cy="192" r="3" fill="#FFFFFF" />
  <circle cx="282" cy="192" r="3" fill="#FFFFFF" />
  <!-- Rosy Cheeks -->
  <circle cx="200" cy="215" r="14" fill="#FCA5A5" opacity="0.6" />
  <circle cx="300" cy="215" r="14" fill="#FCA5A5" opacity="0.6" />
  <!-- Joyful Smile -->
  <path d="M 230,220 Q 250,240 270,220" fill="none" stroke="#991B1B" stroke-width="5" stroke-linecap="round"/>

  <!-- Teddy Bear Being Hugged -->
  <g transform="translate(260, 250)">
    <!-- Ears -->
    <circle cx="45" cy="45" r="16" fill="url(#bearG)" />
    <circle cx="45" cy="45" r="9" fill="#FCD34D" />
    <circle cx="105" cy="45" r="16" fill="url(#bearG)" />
    <circle cx="105" cy="45" r="9" fill="#FCD34D" />
    <!-- Head -->
    <ellipse cx="75" cy="75" rx="42" ry="38" fill="url(#bearG)" />
    <!-- Snout -->
    <ellipse cx="75" cy="85" rx="20" ry="15" fill="#FEF3C7" />
    <path d="M 70,80 L 80,80 L 75,87 Z" fill="#451A03" />
    <!-- Bear Eyes -->
    <circle cx="62" cy="70" r="4.5" fill="#451A03" />
    <circle cx="88" cy="70" r="4.5" fill="#451A03" />
    <!-- Arms Hugging -->
    <path d="M 35,95 Q 5,120 30,140 Q 60,145 75,120" fill="url(#bearG)" />
  </g>

  <!-- Child Arm Hugging Bear -->
  <path d="M 150,350 C 180,330 250,330 290,360 C 270,390 220,390 150,380 Z" fill="#2563EB" />

  <!-- Floating Heart Pulse Badge -->
  <g transform="translate(360, 150)" filter="url(#dropShadow)">
    <circle cx="40" cy="40" r="38" fill="#FFFFFF" />
    <circle cx="40" cy="40" r="32" fill="url(#heartG)" />
    <!-- Heart beat / ECG line -->
    <path d="M 20,40 L 28,40 L 33,28 L 38,50 L 44,34 L 48,43 L 52,40 L 60,40" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
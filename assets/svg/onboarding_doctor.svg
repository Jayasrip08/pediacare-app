<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="docBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="70%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </radialGradient>
    <linearGradient id="coatG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312E81" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="240" r="190" fill="url(#docBg)" filter="url(#shadowD)" />

  <!-- Doctor Body / Lab coat -->
  <path d="M 150,330 C 130,370 110,430 100,480 L 400,480 C 390,430 370,370 350,330 Z" fill="url(#coatG)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Teal Scrub inner V -->
  <path d="M 215,310 L 250,370 L 285,310 Z" fill="#0D9488" />
  
  <!-- Stethoscope around neck -->
  <path d="M 210,300 C 200,370 230,420 250,420 C 270,420 300,370 290,300" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <circle cx="250" cy="425" r="12" fill="#0284C7" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Doctor Head -->
  <circle cx="250" cy="190" r="75" fill="#FDE68A" />
  <!-- Hair: professional ponytail / neat dark brown hair -->
  <path d="M 175,180 C 170,110 215,100 250,105 C 285,100 330,110 325,180 C 315,130 285,125 250,130 C 215,125 185,130 175,180 Z" fill="#292524" />
  <!-- Side hair ponytail -->
  <path d="M 320,180 C 340,190 350,230 340,260 C 330,240 325,210 318,190" fill="#292524" />
  <!-- Eyes -->
  <ellipse cx="225" cy="185" rx="6" ry="8" fill="#1E293B" />
  <ellipse cx="275" cy="185" rx="6" ry="8" fill="#1E293B" />
  <circle cx="227" cy="183" r="2.5" fill="#FFFFFF" />
  <circle cx="277" cy="183" r="2.5" fill="#FFFFFF" />
  <!-- Smile -->
  <path d="M 235,210 Q 250,225 265,210" fill="none" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>

  <!-- Tablet / Clipboard in hands -->
  <g transform="translate(190, 360)">
    <rect x="0" y="0" width="120" height="90" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
    <rect x="8" y="8" width="104" height="74" rx="6" fill="#38BDF8" opacity="0.8"/>
    <!-- Medical cross / chart lines on tablet -->
    <line x1="24" y1="28" x2="60" y2="28" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="44" x2="80" y2="44" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="60" x2="50" y2="60" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Calendar Badge -->
  <g transform="translate(370, 140)" filter="url(#shadowD)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#FFFFFF" />
    <path d="M 0,18 C 0,8 8,0 18,0 L 62,0 C 72,0 80,8 80,18 L 80,26 L 0,26 Z" fill="#3B82F6" />
    <circle cx="24" cy="12" r="3" fill="#FFFFFF" />
    <circle cx="56" cy="12" r="3" fill="#FFFFFF" />
    <!-- Checkmark inside calendar -->
    <circle cx="40" cy="52" r="18" fill="#10B981" />
    <path d="M 33,52 L 38,57 L 48,46" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="recBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="70%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </radialGradient>
    <filter id="recShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="folderG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="shieldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <circle cx="250" cy="240" r="190" fill="url(#recBg)" filter="url(#recShadow)" />

  <!-- 3D Folder Background flap -->
  <g transform="translate(100, 160)" filter="url(#recShadow)">
    <path d="M 20,40 L 120,40 L 150,65 L 280,65 C 295,65 300,75 300,90 L 300,240 C 300,255 290,265 275,265 L 25,265 C 10,265 0,255 0,240 L 0,60 C 0,45 10,40 20,40 Z" 
          fill="#3B82F6" />
  </g>

  <!-- Health ID Card in foreground -->
  <g transform="translate(130, 200)" filter="url(#recShadow)">
    <rect x="0" y="0" width="240" height="150" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- ID Top Accent -->
    <rect x="0" y="0" width="240" height="24" rx="12" fill="#E0F2FE" />
    
    <!-- Child Photo in Card -->
    <rect x="20" y="40" width="60" height="70" rx="10" fill="#FDE68A" />
    <circle cx="50" cy="65" r="18" fill="#78350F" />
    <circle cx="50" cy="72" r="14" fill="#FDE68A" />
    <!-- Medical Info Lines -->
    <rect x="95" y="48" width="115" height="10" rx="5" fill="#3B82F6" />
    <rect x="95" y="68" width="90" height="8" rx="4" fill="#94A3B8" />
    <rect x="95" y="86" width="105" height="8" rx="4" fill="#CBD5E1" />
    <rect x="95" y="104" width="60" height="8" rx="4" fill="#CBD5E1" />

    <!-- Plus badge on card -->
    <circle cx="215" cy="125" r="14" fill="#10B981" />
    <line x1="215" y1="117" x2="215" y2="133" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="207" y1="125" x2="223" y2="125" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Green Shield Checkmark -->
  <g transform="translate(210, 110)" filter="url(#recShadow)">
    <path d="M 40,0 C 70,0 80,15 80,45 C 80,75 50,95 40,105 C 30,95 0,75 0,45 C 0,15 10,0 40,0 Z" fill="url(#shieldG)" />
    <!-- White Checkmark -->
    <path d="M 24,46 L 35,58 L 56,34" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>